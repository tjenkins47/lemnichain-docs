<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Wallet - LemniChain</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; text-align: center; }
        h1 { color: #333; }
        .form-container { max-width: 600px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="text"], select { width: 100%; padding: 8px; box-sizing: border-box; }
        input[type="submit"] { background-color: #4CAF50; color: white; padding: 10px 15px; border: none; cursor: pointer; }
        input[type="submit"]:hover { background-color: #45a049; }
        .loading { display: none; margin: 20px; font-weight: bold; color: blue; }
    </style>
    <script>
        function showLoading() {
            document.getElementById('createButton').disabled = true;
            document.getElementById('loading').style.display = 'block';
            document.body.style.cursor = 'wait';
        }
    </script>
</head>
<body>
    <h1>Create a New Wallet</h1>
    <div class="form-container">
        <form method="POST" onsubmit="showLoading()">
            {{ form.hidden_tag() }}
            <div class="form-group">
                {{ form.memo.label }}
                {{ form.memo(id="memo", placeholder="Enter a note for this wallet") }}
            </div>
			<!--
            <div class="form-group" visible=false>
                {{ form.asset_type.label }}
                {{ form.asset_type() }}
            </div>
			-->
		 <input type="hidden" name="asset_type" value="cryptocurrency">
            <div class="form-group">
                {{ form.submit(id="createButton", value="Create Wallet") }}
            </div>
        </form>
        <div id="loading" class="loading">Creating wallet, please wait...</div>
        <p><a href="{{ url_for('index') }}">Back to Home</a></p>
    </div>
</body>
</html>
